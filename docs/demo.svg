<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="WinProxyToggle CLI demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c2f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#0a0f19"/>
  <rect x="30" y="26" width="900" height="488" rx="16" fill="url(#bg)" stroke="#273650" filter="url(#shadow)"/>
  <circle cx="58" cy="54" r="6" fill="#ff5f57"/>
  <circle cx="80" cy="54" r="6" fill="#febc2e"/>
  <circle cx="102" cy="54" r="6" fill="#28c840"/>
  <text x="480" y="59" text-anchor="middle" font-family="Consolas, 'Cascadia Code', monospace" font-size="14" fill="#8ea1bd">PowerShell 5.1 — WinProxyToggle</text>
  <line x1="30" y1="82" x2="930" y2="82" stroke="#22314b"/>

  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="18">
    <text x="58" y="120" fill="#7ee787">PS&gt;</text>
    <text x="108" y="120" fill="#e6edf3">.\src\proxy-toggle.ps1 status</text>

    <text x="58" y="154" fill="#9fb0c8">WinINET system proxy</text>
    <text x="58" y="180" fill="#c9d1d9">  State          : </text><text x="250" y="180" fill="#7ee787">ON</text>
    <text x="58" y="206" fill="#c9d1d9">  ProxyServer    : 127.0.0.1:7890</text>
    <text x="58" y="232" fill="#c9d1d9">  AutoConfigURL  : (none)</text>

    <text x="58" y="278" fill="#7ee787">PS&gt;</text>
    <text x="108" y="278" fill="#e6edf3">.\src\proxy-toggle.ps1 disable</text>
    <text x="58" y="310" fill="#c9d1d9">System proxy disabled.</text>
    <text x="58" y="336" fill="#8b949e">Saved state: %LOCALAPPDATA%\WinProxyToggle\state.json</text>

    <text x="58" y="382" fill="#7ee787">PS&gt;</text>
    <text x="108" y="382" fill="#e6edf3">.\src\proxy-toggle.ps1 restore</text>
    <text x="58" y="414" fill="#c9d1d9">Previous proxy state restored.</text>

    <text x="58" y="466" fill="#58a6ff">✓</text>
    <text x="86" y="466" fill="#8b949e">reversible · dry-run · saved state · 23 tests</text>
  </g>
</svg>
